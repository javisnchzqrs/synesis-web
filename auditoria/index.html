<style>

  :root {
    --verde-salvia: #8FAF9A;
    --verde-salvia-dark: #6d9278;
    --beige: #F3EDE4;
    --antracita: #3A3A3A;
    --terracota: #D08770;
    --verde-claro: #E4EFE8;
    --chat-bg: #E5DDD4;
    --chat-header: #f5f2ee;
    --burbuja-in: #ffffff;
    --burbuja-out: #d9fdd3;
    --chat-text: #303030;
    --chat-meta: #8a8a8a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--beige);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== MARCO FIJO DE LA AUDITORÍA (barra + contenido + botón) ===== */
  .auditoria {
    width: 100%;
    max-width: 440px;
    height: 92vh;
    max-height: 820px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ===== BARRA DE PROGRESO (fuera del contenido, envuelve todas las slides) ===== */
  .stories-bar {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
    padding: 0 4px;
  }
  .stories-seg {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(58,58,58,0.13);
    overflow: hidden;
  }
  .stories-seg.done { background: var(--verde-salvia); }
  .stories-seg.active::after {
    content: '';
    display: block;
    height: 100%;
    width: 100%;
    background: var(--verde-salvia);
    transform: scaleX(0);
    transform-origin: left;
    animation: fillSeg 0.6s ease forwards;
  }
  @keyframes fillSeg { to { transform: scaleX(1); } }

  /* ===== CONTENIDO VARIABLE (aquí la tarjeta del chat en slide 1) ===== */
  .slide-content {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* Tarjeta que simula móvil de mensajería */
  .chat-card {
    flex: 1;
    min-height: 0;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(58,58,58,0.13);
    display: flex;
    flex-direction: column;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--chat-header);
    border-bottom: 1px solid rgba(58,58,58,0.06);
    flex-shrink: 0;
  }
  .chat-back { color: var(--verde-salvia-dark); display: flex; align-items: center; }
  .chat-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-size: 16px; font-weight: 600; color: var(--antracita); line-height: 1.2; }
  .chat-status { font-size: 12.5px; color: var(--verde-salvia-dark); font-weight: 400; margin-top: 1px; }

  .chat-body {
    flex: 1;
    background-color: var(--chat-bg);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 8%),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.3) 0%, transparent 6%),
      radial-gradient(circle at 45% 85%, rgba(255,255,255,0.35) 0%, transparent 7%);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }

  .msg {
    max-width: 82%;
    padding: 9px 13px 7px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--chat-text);
    position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,0.06);
    opacity: 0;
    transform: translateY(10px);
    animation: msgIn 0.35s ease forwards;
  }
  @keyframes msgIn { to { opacity: 1; transform: translateY(0); } }
  .msg-in { align-self: flex-start; background: var(--burbuja-in); border-top-left-radius: 3px; }
  .msg-out { align-self: flex-end; background: var(--burbuja-out); border-top-right-radius: 3px; }
  .msg-time { font-size: 10.5px; color: var(--chat-meta); text-align: right; margin-top: 3px; display: block; }
  .msg-out .msg-time::after { content: ' ✓✓'; color: #53bdeb; }

  .typing {
    align-self: flex-start;
    background: var(--burbuja-in);
    border-radius: 12px;
    border-top-left-radius: 3px;
    padding: 12px 16px;
    display: none;
    box-shadow: 0 1px 1px rgba(0,0,0,0.06);
  }
  .typing.show { display: flex; gap: 4px; align-items: center; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: #9aa0a6; animation: typingDot 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingDot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }

  /* ===== BOTÓN FIJO ABAJO (envuelve todas las slides) ===== */
  .slide-btn {
    flex-shrink: 0;
    width: 100%;
    padding: 17px 24px;
    background: var(--verde-salvia);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, opacity 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px);
  }
  .slide-btn.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .slide-btn:hover { background: var(--verde-salvia-dark); }
  .slide-btn:active { transform: scale(0.99); }
  .slide-btn svg { flex-shrink: 0; }

/* slide 1 */

  
  
  

  

  
  
  
  
  

  .slide-content { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; justify-content: center; }

  .trad-intro { text-align: center; margin-bottom: 20px; flex-shrink: 0; }

  .trad-destino-text .frase { opacity: 0; transform: translateY(8px); display: block; margin-bottom: 10px; }
  .trad-destino-text .frase.show { animation: fraseIn 0.5s ease forwards; }

  @keyframes fraseIn { to { opacity: 1; transform: translateY(0); } }

  .trad-placeholder {
    font-size: 15px; color: #b8b0a6; font-style: italic; font-weight: 300;
    display: flex; align-items: center; gap: 8px;
  }

  /* Botón traducir dentro de la caja origen */
  .trad-btn-row { display: flex; justify-content: flex-end; margin-top: 16px; }
  .trad-btn {
    background: var(--verde-salvia); color: #fff; border: none; border-radius: 30px;
    padding: 10px 20px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 14px rgba(143,175,154,0.4); transition: background 0.2s, transform 0.15s;
  }
  .trad-btn:hover { background: var(--verde-salvia-dark); }
  .trad-btn:active { transform: scale(0.97); }
  .trad-btn.hidden { display: none; }
  .trad-btn svg { transition: transform 0.6s; }
  .trad-btn.translating svg { transform: rotate(180deg); }

  .slide-btn {
    flex-shrink: 0; width: 100%; padding: 17px 24px;
    background: var(--verde-salvia); color: #ffffff; border: none; border-radius: 14px;
    font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: background 0.2s, transform 0.15s, opacity 0.4s;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    opacity: 0; pointer-events: none; transform: translateY(6px);
  }
  .slide-btn.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .slide-btn:hover { background: var(--verde-salvia-dark); }
  .slide-btn:active { transform: scale(0.99); }

/* slide 2 */

  /* ===== bucle 4 fases ===== */
  .bucle-wrap { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 6px; }

  .bucle-fase {
    position: absolute; width: 45%; z-index: 2;
    background: #fff; border-radius: 12px; padding: 10px 12px;

    border: 1.5px solid rgba(58,58,58,0.06);
    transition: box-shadow 0.4s, border-color 0.4s, transform 0.4s;
  }
  .bucle-fase .bucle-num { font-size: 9px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--terracota); margin-bottom: 3px; }

  .bucle-fase.fase-bottom.activa { transform: translateX(-50%) scale(1.05); }

  .bucle-remate { flex-shrink: 0; text-align: center; font-size: 14px; font-weight: 300; color: var(--gris-texto); margin: 6px 0; }
  .bucle-remate strong { font-weight: 700; color: var(--terracota); }

  .slide-btn { flex-shrink: 0; width: 100%; padding: 16px 24px; background: var(--verde-salvia); color: #fff; border: none; border-radius: 14px; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 9px; margin-top: auto; z-index: 2; }
  .slide-btn:hover { background: var(--verde-salvia-dark); }

  .slide { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 13px; position: relative; }

  /* abierta */
  .edad-card.abierta { background: #fff; border: 1.5px solid rgba(224,112,112,0.18); box-shadow: 0 4px 18px rgba(58,58,58,0.07); }

  /* imagen arriba con difuminado inferior */

<script>
  function initSlide0(root){
    try {

  const typing = root.querySelector('#typing');
  const msgPaloma = root.querySelector('#msg-paloma');
  const status = root.querySelector('#chat-status');
  const btn = root.querySelector('#slide-btn');

  const T_ANTES_ESCRIBIR = 2000;
  const T_ESCRIBIENDO = 2500;

  setTimeout(() => {
    typing.classList.add('show');
    status.textContent = 'escribiendo\u2026';
    setTimeout(() => {
      typing.classList.remove('show');
      status.textContent = 'en l\u00ednea';
      msgPaloma.style.display = 'block';
      setTimeout(() => btn.classList.add('show'), 1000);
    }, T_ESCRIBIENDO);
  }, T_ANTES_ESCRIBIR);

  

    } catch(e){ console.warn("init 0",e); }
  }
  function initSlide1(root){
    try {

  const btn = root.querySelector('#trad-btn');
  const placeholder = root.querySelector('#placeholder');
  const destino = root.querySelector('#destino');
  const slideBtn = root.querySelector('#slide-btn');
  let traducido = false;

  window.traducir = function() {
    if (traducido) return;
    traducido = true;
    btn.classList.add('translating');
    setTimeout(() => {
      btn.classList.add('hidden');
      placeholder.style.display = 'none';
      destino.style.display = 'block';
      const frases = destino.querySelectorAll('.frase');
      frases.forEach((f, i) => setTimeout(() => f.classList.add('show'), i * 700));
      setTimeout(() => slideBtn.classList.add('show'), frases.length * 700 + 600);
    }, 600);
  }

  setTimeout(() => { if (!traducido) traducir(); }, 7500);

  

    } catch(e){ console.warn("init 1",e); }
  }
  function initSlide2(root){
    try {

  var bucleFases = root.querySelectorAll('.bucle-fase');
  var bucleIdx = 0;
  function bucleGirar(){
    bucleFases.forEach(function(f){ f.classList.remove('activa'); });
    var actual = root.querySelector('.bucle-fase[data-fase="'+bucleIdx+'"]');
    if (actual) actual.classList.add('activa');
    bucleIdx = (bucleIdx + 1) % 4;
  }
  bucleGirar();
  setInterval(bucleGirar, 1100);

    } catch(e){ console.warn("init 2",e); }
  }
  function initSlide3(root){
    try {

  window.abrirEdad = function(card){
    card.classList.remove('cerrada');
    card.classList.add('abierta','recien-abierta');
    card.onclick = null;
  }

    } catch(e){ console.warn("init 3",e); }
  }
  function initSlide8(root){
    try {

  (function(){
    var chat = root.querySelector('#c-chat');
    var typing = root.querySelector('#c-typing');
    var estado = root.querySelector('#c-estado');
    var cta = root.querySelector('#c-cta');
    function scrollChat(){ chat.scrollTop = chat.scrollHeight; }
    scrollChat();
    setTimeout(function(){
      typing.classList.add('show'); estado.textContent = 'escribiendo\u2026'; scrollChat();
      setTimeout(function(){
        typing.classList.remove('show'); estado.textContent = 'en l\u00ednea';
        var m = document.createElement('div');
        m.className = 'msg msg-in';
        m.style.animationDelay = '0s';
        m.innerHTML = 'Si veo que esto no encaja contigo, te lo digo yo. Y te llevar\u00e1s mucha m\u00e1s claridad de la que tienes ahora. \ud83c\udf31<span class="msg-time">21:15</span>';
        chat.appendChild(m); scrollChat();
        setTimeout(function(){ cta.style.opacity = '1'; cta.style.pointerEvents = 'auto'; }, 700);
      }, 2200);
    }, 2000);
  })();

    } catch(e){ console.warn("init 8",e); }
  }

function arrancarAuditoria(){
  var slides = document.querySelectorAll('.slide-wrap');
  var segs = document.querySelectorAll('.stories-seg');
  var cur = 0, done = {};
  var initMap = {"0": "initSlide0", "1": "initSlide1", "2": "initSlide2", "3": "initSlide3", "8": "initSlide8"};
  function show(i){
    for (var n=0;n<slides.length;n++){
      slides[n].classList.toggle('active', n===i);
      segs[n].classList.toggle('done', n<i);
      segs[n].classList.toggle('active', n===i);
    }
    cur = i;
    if(!done[i]){ if(initMap[i]){ done[i]=true; setTimeout(function(){ window[initMap[i]](slides[i]); }, 80); } }
  }
  window.nextSlide = function(){ if(cur<slides.length-1) show(cur+1); };
  window.prevSlide = function(){ if(cur>0) show(cur-1); };
  function arrancar(){
    slides = document.querySelectorAll('.slide-wrap');
    segs = document.querySelectorAll('.stories-seg');
    if(!slides.length){ setTimeout(arrancar, 100); return; }
    show(0);
  }
  arrancar();
}
</script>
<script>
(function(){
  var DATOS = 'datos/';
  var MAX_ESPERA = 180000; // 3 minutos
  var INTERVALO = 3000;
  var app = document.getElementById('app');
  var tpl = document.getElementById('tpl').innerHTML;
  var id = (new URLSearchParams(location.search).get('id') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');

  function seguro(v){
    var s = String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    return s.replace(/&lt;(\/?)strong&gt;/g, '<$1strong>');
  }
  function pintar(d){
    if (!d.nombre_hijo) d.nombre_hijo = 'tu peque';
    app.innerHTML = tpl.replace(/\{\{([a-z0-9_]+)\}\}/g, function(m, k){ return seguro(d[k]); });
    try { window.dataLayer = window.dataLayer || []; window.dataLayer.push({ event: 'synesis_auditoria_vista', angulo: d.angulo || '' }); } catch(e) {}
    arrancarAuditoria();
  }
  function mensaje(titulo, texto){
    app.innerHTML = '<div class="espera"><img src="/media/fotos/paloma-avatar.png" alt="Paloma"><h1>' + titulo + '</h1><p>' + texto + '</p></div>';
  }
  if (!id) { mensaje('No encuentro tu análisis', 'El enlace no está completo. Revisa que lo hayas copiado entero.'); return; }
  var inicio = Date.now();
  function intentar(){
    fetch(DATOS + id + '.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(pintar)
      .catch(function(){
        if (Date.now() - inicio < MAX_ESPERA) { setTimeout(intentar, INTERVALO); return; }
        mensaje('Tu análisis está tardando más de lo normal', 'No te preocupes: tus respuestas me han llegado. Lo reviso y te escribo por email. Mientras, si quieres, <a href="/reserva/">puedes reservar ya tu llamada conmigo</a>.');
      });
  }
  intentar();
})();

</script>
