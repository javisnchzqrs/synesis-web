<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kit de rabietas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500;1,9..40,600&display=swap" rel="stylesheet">
<style>
/* Layout: app móvil. Botón SOS arriba para el momento difícil, camino guiado debajo; cada tarea se abre a pantalla completa con una cosa por pantalla; navegación inferior fija. */
:root {
  --bg: #F3EDE4;
  --surface: #FFFDF9;
  --soft: #E4EFE8;
  --text: #3A3A3A;
  --muted: #74746C;
  --sage: #8FAF9A;
  --sage-deep: #6D9278;
  --on-sage: #22302A;
  --terra: #D08770;
  --terra-soft: #F7E6DF;
  --line: rgba(58, 58, 58, 0.10);
  --shadow: 0 1px 2px rgba(58, 58, 58, 0.05), 0 10px 30px rgba(58, 58, 58, 0.07);
  --font: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --nav-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C211F; --surface: #252B28; --soft: #2C3832; --text: #EDE9E1; --muted: #AEB3AA;
    --sage: #8FAF9A; --sage-deep: #A9C6B2; --on-sage: #17201B; --terra: #E3A08A; --terra-soft: #3B2D27;
    --line: rgba(237, 233, 225, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C211F; --surface: #252B28; --soft: #2C3832; --text: #EDE9E1; --muted: #AEB3AA;
  --sage: #8FAF9A; --sage-deep: #A9C6B2; --on-sage: #17201B; --terra: #E3A08A; --terra-soft: #3B2D27;
  --line: rgba(237, 233, 225, 0.12);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sage-deep); outline-offset: 2px; }
svg.lucide { width: 22px; height: 22px; flex: none; }
[hidden] { display: none !important; }

.app { max-width: 520px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }

/* Cabecera */
.top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; }
.brand svg { width: 28px; height: 28px; color: var(--sage); }
.pill { font-size: 12px; font-weight: 600; color: var(--sage-deep); background: var(--soft); padding: 5px 11px; border-radius: 999px; }
.screen-title { font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; margin: 22px 0 6px; text-wrap: balance; }
.screen-sub { color: var(--muted); margin: 0 0 18px; }

/* Tarjetas */
.card { background: var(--surface); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); }
.stack { display: grid; gap: 14px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px/1.2 var(--font); background: var(--text); color: var(--bg); border: 0; border-radius: 999px; padding: 15px 22px; cursor: pointer; min-height: 52px; }
.btn.sage { background: var(--sage); color: var(--on-sage); }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 0; font: 600 14px/1.4 var(--font); color: var(--sage-deep); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Hero de inicio */
.hero { background: var(--sage); color: var(--on-sage); border-radius: 28px; padding: 24px 22px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.14); }
.hero .k { font-size: 13px; font-weight: 600; opacity: .85; margin: 0 0 8px; }
.hero h2 { font-size: 24px; line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 18px; font-weight: 700; text-wrap: balance; position: relative; }
.hero blockquote { margin: 0 0 18px; font-size: 22px; line-height: 1.3; font-weight: 600; font-style: italic; text-wrap: balance; position: relative; }
.hero .btn { background: var(--on-sage); color: #F3EDE4; position: relative; }
.hero .meta { display: flex; align-items: center; gap: 14px; position: relative; }
.hero .meta span { font-size: 14px; font-weight: 500; opacity: .85; }

/* Camino */
.path { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: 20px; padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow); }
.step .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--soft); color: var(--sage-deep); }
.step.done .ic { background: var(--sage); color: var(--on-sage); }
.step.next { box-shadow: var(--shadow), inset 0 0 0 2px var(--sage); }
.step b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
.step small { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.step .go { color: var(--muted); }
.badge-next { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--on-sage); background: var(--sage); padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }

/* Mini caja en inicio */
.mini-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; border: 0; text-align: left; cursor: pointer; }
.mini-icons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mini-icons span { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.mini-icons span.in { background: var(--soft); color: var(--sage-deep); }
.mini-icons span.star { background: var(--sage); color: var(--on-sage); }
.mini-icons svg.lucide { width: 16px; height: 16px; }
.big-num { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.big-num small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }

/* Caja */
.box { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
.box-head { background: var(--sage-deep); color: #FFFDF9; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
.box-head b { font-size: 15px; }
.box-head span { font-size: 14px; font-variant-numeric: tabular-nums; opacity: .92; }
.meter { height: 6px; background: rgba(255,255,255,.25); border-radius: 6px; margin: 0 20px; position: relative; top: -10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: #FFFDF9; border-radius: 6px; transition: width .5s ease; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 8px 14px 16px; }
.tile { position: relative; border: 0; border-radius: 18px; padding: 14px 6px 12px; background: var(--bg); cursor: pointer; display: grid; justify-items: center; gap: 8px; min-height: 96px; align-content: center; }
.tile .ti { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: var(--muted); background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.tile span { font-size: 12.5px; font-weight: 600; line-height: 1.2; text-align: center; color: var(--muted); }
.tile.in { background: var(--soft); }
.tile.in .ti { background: var(--surface); color: var(--sage-deep); box-shadow: none; }
.tile.in span { color: var(--text); }
.tile.star { background: var(--sage); }
.tile.star .ti { background: rgba(255,255,255,.35); color: var(--on-sage); box-shadow: none; }
.tile.star span { color: var(--on-sage); }
.tile .st { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--terra); color: #fff; display: grid; place-items: center; }
.tile .st svg.lucide { width: 12px; height: 12px; }
.tile .rec { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--terra); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); padding: 0 6px; margin-top: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* Lista de escenas */
.scene-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); cursor: pointer; }
.scene-card .where { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--terra); }
.scene-card b { display: block; font-size: 17px; margin: 2px 0 4px; }
.scene-card q { display: block; font-size: 14.5px; font-style: italic; color: var(--muted); quotes: "«" "»"; line-height: 1.4; }
.scene-card .ok { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.scene-card .ok.done { background: var(--sage); color: var(--on-sage); }

/* Navegación inferior */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { background: none; border: 0; cursor: pointer; display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--text); }
.nav button[aria-current="page"] .nic { background: var(--soft); color: var(--sage-deep); }
.nav .nic { width: 54px; height: 30px; border-radius: 999px; display: grid; place-items: center; }

/* Flujo a pantalla completa */
.flow { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); animation: up .28s ease; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.flow-bar { flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); max-width: 560px; width: 100%; margin: 0 auto; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
.bar { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sage); border-radius: 6px; transition: width .35s ease; }
.flow-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.flow-in { max-width: 520px; margin: 0 auto; padding: 12px max(22px, env(safe-area-inset-right, 0px)) 24px max(22px, env(safe-area-inset-left, 0px)); }
.flow-foot { flex: none; padding: 12px max(22px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); max-width: 520px; width: 100%; margin: 0 auto; display: grid; gap: 10px; }
.flow-foot:empty { display: none; }
.q-kicker { font-size: 13px; font-weight: 600; color: var(--sage-deep); margin: 8px 0 8px; }
.q { font-size: 27px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; text-wrap: balance; }
.q-help { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: 500 16px/1.4 var(--font); background: var(--surface); border: 0; border-radius: 18px; padding: 16px 18px; cursor: pointer; box-shadow: var(--shadow); min-height: 60px; transition: transform .1s; }
.opt:active { transform: scale(.985); }
.opt .oi { width: 36px; height: 36px; border-radius: 12px; background: var(--soft); color: var(--sage-deep); display: grid; place-items: center; flex: none; }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--sage-deep), var(--shadow); background: var(--soft); }
.opt[aria-pressed="true"] .oi { background: var(--sage); color: var(--on-sage); }
.opt.picked { box-shadow: inset 0 0 0 2px var(--sage-deep); background: var(--soft); }
.opt.faded { opacity: .45; }
.opt:disabled { cursor: default; }
.group-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 22px 0 -6px; }
.tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.tool-grid .tile { background: var(--surface); box-shadow: var(--shadow); }
.tool-grid .tile[aria-pressed="true"] { background: var(--sage); }
.tool-grid .tile[aria-pressed="true"] .ti { background: rgba(255,255,255,.35); color: var(--on-sage); box-shadow: none; }
.tool-grid .tile[aria-pressed="true"] span { color: var(--on-sage); }

/* Páginas de resultado */
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 7px; background: var(--line); transition: width .25s; }
.dots i.on { width: 22px; background: var(--sage-deep); }
.big-card { background: var(--surface); border-radius: 28px; padding: 26px 22px; box-shadow: var(--shadow); margin-top: 8px; }
.big-card.sage { background: var(--sage); color: var(--on-sage); }
.big-card.terra { background: var(--terra-soft); }
.big-card .k { font-size: 13px; font-weight: 600; margin: 0 0 10px; opacity: .85; }
.quote { font-size: 27px; line-height: 1.25; font-weight: 600; font-style: italic; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.4); margin-top: 18px; }
.big-card h3 { font-size: 22px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.01em; }
.big-card p { margin: 0 0 12px; font-size: 17px; }
.big-card p:last-child { margin-bottom: 0; }
.center-page { min-height: calc(100vh - 230px); display: grid; align-content: center; }
.center-page .big-card.sage { padding: 34px 26px; }
.center-page .big-card.sage .quote { font-size: 31px; }
.soft-note { font-size: 15px; color: var(--muted); background: var(--bg); border-radius: 16px; padding: 12px 14px; margin-top: 16px; }
.sign { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; }
.sign:first-of-type { border-top: 0; }
.sign .si { width: 36px; height: 36px; border-radius: 12px; background: var(--soft); color: var(--sage-deep); display: grid; place-items: center; }
.num { width: 30px; height: 30px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 14px; font-weight: 700; }

/* Escenas */
.voice-card { background: var(--terra-soft); border-radius: 28px; padding: 28px 24px; margin-top: 8px; }
.voice-card .who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--terra); margin-bottom: 14px; }
.voice-card .quote { font-size: 28px; }
.scene-text { font-size: 19px; line-height: 1.5; margin: 6px 0 0; }
.fb { border-radius: 22px; padding: 18px; margin-top: 16px; animation: up .25s ease; }
.fb.good { background: var(--sage); color: var(--on-sage); }
.fb.other { background: var(--terra-soft); }
.fb b { display: flex; align-items: center; gap: 8px; font-size: 17px; margin-bottom: 4px; }
.fb p { margin: 0; font-size: 16px; }
.fb .better { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(58,58,58,.12); }
.fb .better small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--terra); margin-bottom: 4px; }
.recap { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.recap:first-of-type { border-top: 0; }
.recap p { margin: 0; font-size: 15.5px; }
.recap small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }

/* Hoja inferior */
.sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(28, 33, 31, .38); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px max(22px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); animation: sheetUp .3s cubic-bezier(.2,.9,.3,1); }
@keyframes sheetUp { from { transform: translateY(100%); } }
.sheet-in { max-width: 520px; margin: 0 auto; }
.grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 16px; }
.sheet-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.sheet-head .ti { width: 56px; height: 56px; border-radius: 18px; background: var(--soft); color: var(--sage-deep); display: grid; place-items: center; }
.sheet-head .ti svg.lucide { width: 28px; height: 28px; }
.sheet-head h3 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; }
.sheet-head small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.block-k { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--sage-deep); margin: 0 0 6px; }
.game { background: var(--bg); border-radius: 18px; padding: 16px; font-size: 16px; margin-bottom: 14px; }
.say { background: var(--soft); border-radius: 18px; padding: 16px; font-size: 19px; font-weight: 600; font-style: italic; line-height: 1.35; margin-bottom: 18px; }
.status-row { display: flex; gap: 8px; margin-bottom: 16px; }
.status-row span { flex: 1; text-align: center; font-size: 12.5px; font-weight: 600; padding: 8px 4px; border-radius: 12px; background: var(--bg); color: var(--muted); }
.status-row span.on { background: var(--sage); color: var(--on-sage); }
.party { text-align: center; padding: 6px 0 4px; }
.party .burst { width: 84px; height: 84px; border-radius: 50%; background: var(--sage); color: var(--on-sage); display: grid; place-items: center; margin: 4px auto 14px; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
.party .burst svg.lucide { width: 40px; height: 40px; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.party h3 { font-size: 24px; margin: 0 0 8px; }
.party p { color: var(--muted); margin: 0 0 18px; }


.sos { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; width: 100%; text-align: left; border: 0; background: var(--terra-soft); border-radius: 24px; padding: 18px; cursor: pointer; }
.sos .ic { width: 52px; height: 52px; border-radius: 16px; background: var(--terra); color: #FFFDF9; display: grid; place-items: center; }
.sos b { display: block; font-size: 18px; line-height: 1.25; }
.sos small { display: block; font-size: 14px; color: var(--muted); }
.sos .go { color: var(--terra); }
.step.urgent .ic { background: var(--terra); color: #FFFDF9; }
.step.urgent { background: var(--terra-soft); box-shadow: none; }
.phrase-card { background: var(--soft); border-radius: 20px; padding: 18px 20px; font-size: 21px; line-height: 1.35; font-weight: 600; font-style: italic; margin-top: 12px; text-wrap: pretty; }
.step-k { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.2; margin: 18px 0 4px; }
.step-k .num { flex: none; }
.nota { font-size: 16px; color: var(--muted); margin: 14px 0 0; line-height: 1.5; }
.q-kicker { display: flex; align-items: center; gap: 6px; }
.q-kicker svg.lucide { width: 16px; height: 16px; }
.big-card .k { display: flex; align-items: center; gap: 6px; }
.big-card .k svg.lucide, .mblock .mk svg.lucide { width: 16px; height: 16px; }
.si.big { width: 48px; height: 48px; border-radius: 15px; background: var(--soft); color: var(--sage-deep); display: grid; place-items: center; flex: none; }
.type-note { display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: 18px; padding: 14px 16px; margin-top: 20px; font-size: 15.5px; font-weight: 500; }
.type-note .si { width: 36px; height: 36px; border-radius: 12px; background: var(--surface); color: var(--sage-deep); display: grid; place-items: center; flex: none; }
.mblock { border-radius: 20px; padding: 16px; margin-top: 10px; background: var(--bg); }
.mblock .mk { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--sage-deep); margin: 0 0 4px; }
.mblock.burst { background: var(--terra-soft); }
.mblock.burst .mk { color: var(--terra); }
.mblock p { margin: 0; font-size: 16px; }
.prog-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px 8px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 16px; font: 600 14px/1.2 var(--font); cursor: pointer; color: var(--text); }
.fchip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.ex { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14.5px; color: var(--muted); line-height: 1.4; }
.cycles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
.orb { width: 200px; height: 200px; max-width: 62vw; max-height: 62vw; border-radius: 50%; margin: 30px auto 22px; background: radial-gradient(circle at 35% 30%, var(--soft), var(--sage)); transform: scale(.6); transition: transform 1s ease-in-out; }
.orb.in { transform: scale(1); transition: transform 4s ease-in-out; }
.orb.out { transform: scale(.6); transition: transform 6s ease-in-out; }
.breath-label { font-size: 28px; font-weight: 700; margin: 0; min-height: 40px; }
.breath-phrase { font-style: italic; color: var(--muted); font-size: 19px; min-height: 58px; max-width: 28ch; margin: 6px auto 0; }
.copy-msg { font-size: 14px; color: var(--muted); margin: 14px 0 0; }
.copy-msg:empty { display: none; }
.copy-fallback { width: 100%; min-height: 140px; margin-top: 10px; font: 14px/1.5 var(--font); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

      else if (a === 'semana') openSemana();

/* ---------- Test de tipo ---------- */
function openTest() {
  var st = { i: 0, picks: [], res: null, page: 0 };
  function compute() {
    var sc2 = { necesidad: 0, limite: 0, desborde: 0, enfado: 0 };
    st.picks.forEach(function (o) { Object.keys(o.s).forEach(function (k) { sc2[k] += o.s[k]; }); });
    var order = Object.keys(sc2).sort(function (a, b) { return sc2[b] - sc2[a]; });
    var mixed = sc2[order[1]] > 0 && sc2[order[0]] - sc2[order[1]] <= 1;
    return { main: order[0], second: mixed ? order[1] : null };
  }
  var TOTAL = QUESTIONS.length + 4;
  flow({
    back: function () { if (st.res) { if (st.page > 0) st.page--; else { st.res = null; st.i = QUESTIONS.length - 1; st.picks.pop(); } } else if (st.i > 0) { st.i--; st.picks.pop(); } F.draw(); },
    draw: function () {
      if (!st.res) {
        var Q = QUESTIONS[st.i];
        paint((st.i + 1) / TOTAL, '<p class="q-kicker">Pregunta ' + (st.i + 1) + ' de ' + QUESTIONS.length + '</p><h2 class="q">' + Q.q + '</h2><p class="q-help">Piensa en la última rabieta, o en la que más se repite.</p>' + optsHtml(Q.o.map(function (o, k) { return { id: String(k), t: o.t }; }), null), '', st.i > 0);
        document.querySelectorAll('#f-in .opt').forEach(function (b) {
          b.onclick = function () {
            b.setAttribute('aria-pressed', 'true');
            st.picks.push(Q.o[Number(b.getAttribute('data-id'))]);
            setTimeout(function () { if (st.i < QUESTIONS.length - 1) st.i++; else { st.res = compute(); st.page = 0; mem.tipo = st.res.main; save(); } F.draw(); }, 160);
          };
        });
        return;
      }
      var T = TYPES[st.res.main], key = st.res.main;
      var pages = [
        '<div class="big-card sage"><p class="k">' + (st.res.second ? 'Parece una mezcla, sobre todo de' : 'Parece una rabieta de tipo') + '</p><p class="quote" style="font-style:normal;font-weight:700">' + T.nombre + '</p><p style="margin-top:12px;font-size:17px">' + T.resumen + '</p><span class="chip">' + icon(TIPO_ICON[key]) + TIPO_CORTO[key] + '</span></div>',
        '<div class="big-card"><h3>Qué le pasa por dentro</h3><p>' + T.dentro + '</p>' + (st.res.second ? '<div class="soft-note">También hay pistas de «' + TYPES[st.res.second].nombre + '». Es muy normal: muchas rabietas mezclan más de un motivo.</div>' : '') + '</div>',
        '<div class="big-card"><h3>Señales para observar</h3>' + T.senales.map(function (s) { return '<div class="sign"><span class="si">' + icon('eye') + '</span><span>' + s + '</span></div>'; }).join('') + '</div>',
        '<div class="big-card terra"><h3>Cómo anticiparte</h3><p>' + T.anticipar + '</p></div>'
      ];
      var last = st.page === pages.length - 1;
      paint((QUESTIONS.length + st.page + 1) / TOTAL, '<div class="center-page">' + pages[st.page] + '</div>', dots(pages.length, st.page) + (last ? '<button class="btn block" id="f-next">Ver frases para este tipo ' + icon('arrow-right') + '</button>' : '<button class="btn block" id="f-next">Siguiente</button>'), true);
      document.getElementById('f-next').onclick = function () { if (last) openFrases(T.escenario); else { st.page++; F.draw(); } };

/* ---------- Mi semana ---------- */
function deduceTipo(pistas) {
  var s2 = { necesidad: 0, limite: 0, desborde: 0, enfado: 0 };
  PISTAS.forEach(function (p) { if (pistas.indexOf(p.id) > -1) p.s.forEach(function (k) { s2[k]++; }); });
  var order = Object.keys(s2).sort(function (a, b) { return s2[b] - s2[a]; });
  if (s2[order[0]] === 0) return { main: 'mezcla', fondo: null, tie: null };
  if (s2[order[0]] === s2[order[1]]) return { main: 'mezcla', fondo: null, tie: [order[0], order[1]] };
  return { main: order[0], fondo: s2[order[1]] > 0 ? order[1] : null, tie: null };
}
function pickScenario(tipo, momento) {
  var pool = SIM.filter(function (s) { return tipo === 'mezcla' || s.tipo === tipo; });
  var exact = pool.filter(function (s) { return s.momento === momento; });
  if (exact.length) return exact[0];
  var byM = SIM.filter(function (s) { return s.momento === momento; });
  if (tipo === 'mezcla' && byM.length) return byM[0];
  return pool[0];
}
function openSemana() {
  var st = { i: 0, a: { momento: null, pistas: [], hice: [], compara: null, adulto: null }, done: false };
  var KEYS = ['momento', 'pistas', 'hice', 'compara', 'adulto'];
  flow({
    back: function () { if (st.done) st.done = false; else if (st.i > 0) st.i--; F.draw(); },
    draw: function () {
      if (st.done) return result();
      var key = KEYS[st.i], html = '', foot = '', multi = false;
      var kick = '<p class="q-kicker">Mi semana · ' + (st.i + 1) + ' de ' + KEYS.length + '</p>';
      if (key === 'momento') html = kick + '<h2 class="q">¿Qué momento costó más esta semana?</h2><div class="tool-grid">' + MOMENTS.concat([{ id: 'otro', label: 'Otro momento' }]).map(function (m) { return '<button class="tile" data-id="' + m.id + '" aria-pressed="' + (st.a.momento === m.id) + '"><span class="ti">' + icon(MOM_ICON[m.id]) + '</span><span>' + m.label + '</span></button>'; }).join('') + '</div>';
      if (key === 'pistas') { multi = true; html = kick + '<h2 class="q">¿Qué parecía haber detrás?</h2><p class="q-help">Marca todo lo que encaje. No hace falta acertar.</p>' + optsHtml(PISTAS.map(function (p) { return { id: p.id, t: p.t, i: PISTA_ICON[p.id] }; }), st.a.pistas, true); foot = '<button class="btn block" id="f-next">' + (st.a.pistas.length ? 'Siguiente' : 'No lo sé, seguir') + '</button>'; }
      if (key === 'hice') { multi = true; html = kick + '<h2 class="q">¿Qué hiciste la mayoría de las veces?</h2><p class="q-help">Sin notas: lo que no sale bien también cuenta.</p><p class="group-label">Lo que enseñan los vídeos</p>' + optsHtml(HICE_BIEN.map(function (h) { return { id: h.id, t: h.t, i: HICE_ICON[h.id] }; }), st.a.hice, true) + '<p class="group-label">Lo que también pasa</p>' + optsHtml(HICE_TAMBIEN.map(function (h) { return { id: h.id, t: h.t, i: HICE_ICON[h.id] }; }), st.a.hice, true); foot = '<button class="btn block" id="f-next">Siguiente</button>'; }
      if (key === 'compara') html = kick + '<h2 class="q">Comparado con la semana pasada, ¿cómo fue?</h2>' + optsHtml(COMPARA.map(function (c) { return { id: c.id, t: c.t, i: COMPARA_ICON[c.id] }; }), st.a.compara);
      if (key === 'adulto') { html = kick + '<h2 class="q">¿Y tú, cómo terminas la semana?</h2><p class="q-help">Opcional, solo para ti.</p>' + optsHtml(ADULTO.map(function (c) { return { id: c.id, t: c.t, i: ADULTO_ICON[c.id] }; }), st.a.adulto); foot = '<button class="btn ghost block" id="f-skip">Saltar y ver mi semana</button>'; }
      paint((st.i + 1) / (KEYS.length + 1), html, foot, st.i > 0);
      document.querySelectorAll('#f-in [data-id]').forEach(function (b) {
        b.onclick = function () {
          var id = b.getAttribute('data-id');
          if (multi) { var arr = st.a[key], i = arr.indexOf(id); if (i > -1) arr.splice(i, 1); else arr.push(id); F.draw(); return; }
          st.a[key] = id; b.setAttribute('aria-pressed', 'true');
          setTimeout(function () { if (st.i < KEYS.length - 1) st.i++; else finish(); F.draw(); }, 160);
        };
      });
      var nx = document.getElementById('f-next'); if (nx) nx.onclick = function () { st.i++; F.draw(); };
      var sk = document.getElementById('f-skip'); if (sk) sk.onclick = function () { st.a.adulto = null; finish(); F.draw(); };
    }
  });
  function finish() { st.done = true; var d = new Date(); mem.semana = d.getDate() + '/' + (d.getMonth() + 1); save(); }
  function result() {
    var a = st.a, t = deduceTipo(a.pistas);
    var animoKey = a.compara === 'peor' ? (a.hice.indexOf('limite') > -1 ? 'limites' : 'dura') : (a.compara || 'igual');
    var noFue = ['cedi', 'grite', 'castigue', 'explique', 'mefui'].filter(function (k) { return a.hice.indexOf(k) > -1; })[0] || null;
    var bien = HICE_BIEN.filter(function (h) { return a.hice.indexOf(h.id) > -1; });
    var mom = MOMENTS.filter(function (m) { return m.id === a.momento; })[0] || null;
    var rec = pickScenario(t.main, a.momento);
    var patron;
    if (t.main === 'mezcla' && t.tie) patron = 'Una mezcla de <b>' + TIPO_LABEL[t.tie[0]] + '</b> y <b>' + TIPO_LABEL[t.tie[1]] + '</b>.';
    else if (t.main === 'mezcla') patron = 'Las rabietas parecen venir de sitios distintos.';
    else patron = 'Sobre todo de <b>' + TIPO_LABEL[t.main] + '</b>' + (t.fondo ? ', ' + FONDO[t.fondo] : '') + '.';
    var tool = TOOL_TIPO[t.main];
    var html = '<div class="big-card sage"><p class="k">' + icon('calendar-check') + ' Tu semana</p><p style="font-size:19px;font-weight:500;line-height:1.45">' + ANIMO[animoKey] + '</p></div>' +
      '<div class="big-card" style="margin-top:14px"><p class="k" style="color:var(--sage-deep)">Qué parece haber detrás</p><div style="display:flex;gap:14px;align-items:center"><span class="si big">' + icon(TIPO_ICON[t.main]) + '</span><p style="margin:0;font-size:18px">' + patron + '</p></div><div class="soft-note">Es un patrón para orientarte, no un diagnóstico. Tú conoces a tu peque mejor que nadie.</div>' +
      (bien.length ? '<p class="k" style="color:var(--muted);margin-top:18px">Lo que ya estás haciendo</p>' + bien.map(function (b) { return '<div class="sign"><span class="si">' + icon('check') + '</span><span>' + b.t + '</span></div>'; }).join('') : '') + '</div>' +
      '<h2 class="q" style="margin-top:28px;font-size:23px">Tus herramientas para la semana que viene</h2>' +
      '<div class="big-card"><p class="k" style="color:var(--sage-deep)">' + icon(TIPO_ICON[t.main]) + ' Por el tipo de rabieta</p><p style="font-size:16px">' + tool.intro + '</p>' + tool.items.map(function (it, i) { return '<div class="sign"><span class="num">' + (i + 1) + '</span><span style="font-size:15.5px">' + it + '</span></div>'; }).join('') + '</div>' +
      (mom ? '<div class="big-card" style="margin-top:14px"><p class="k" style="color:var(--sage-deep)">' + icon(MOM_ICON[mom.id]) + ' Para ' + MOM_PARA[mom.id] + '</p><p style="font-size:16px">' + TOOL_MOMENTO[mom.id] + '</p><button class="link" id="r-mom">Ver cómo preparar este momento</button></div>' : '') +
      (noFue ? '<div class="big-card" style="margin-top:14px"><p class="k" style="color:var(--muted)">' + icon(HICE_ICON[noFue]) + ' Para lo que no salió como querías</p><p style="font-size:16px">' + TOOL_NO[noFue] + '</p></div>' : '');
    if (a.adulto && a.adulto !== 'calma') {
      var palabra = { cansancio: 'con mucho cansancio', enfado: 'con enfado', culpa: 'con culpa' }[a.adulto];
      html += '<div class="big-card terra" style="margin-top:14px"><p class="k" style="color:var(--terra)">' + icon('heart') + ' Para ti</p><p style="font-size:16px">Esta semana terminas ' + palabra + '. Es normal: acompañar rabietas cansa. Cuidarte también es parte de acompañarle, así que respira un momento. Esto es solo lo que se ve; lo de fondo también se puede trabajar.</p><button class="btn sage" id="r-breath">' + icon('wind') + ' Respirar ahora</button></div>';
    }
    if (rec) html += '<button class="scene-card" id="r-sim" style="margin-top:14px"><span style="min-width:0"><span class="where">Practica esta escena</span><b>' + rec.titulo + '</b><span class="ex">' + rec.escena + '</span></span><span class="ok">' + icon('play') + '</span></button>';
    html += '<p class="copy-msg" id="copy-msg" aria-live="polite"></p>';
    paint(1, html, '<button class="btn ghost block" id="r-copy">' + icon('copy') + ' Copiar mis herramientas</button><button class="btn block" id="r-done">Hecho</button>', true);
    document.getElementById('r-done').onclick = closeFlow;
    var rm = document.getElementById('r-mom'); if (rm) rm.onclick = function () { closeFlow(); go('momentos'); openMoment(mom.id); };
    var rb = document.getElementById('r-breath'); if (rb) rb.onclick = openPausa;
    var rs = document.getElementById('r-sim'); if (rs) rs.onclick = function () { openSim(rec.n); };
    document.getElementById('r-copy').onclick = function () {
      var txt = 'Mis herramientas para esta semana (Kit de rabietas, Método Synesis)\n\n' + tool.intro + '\n' + tool.items.map(function (i) { return '- ' + i; }).join('\n') +
        (mom ? '\n\n' + mom.label + ': ' + TOOL_MOMENTO[mom.id] : '') + (noFue ? '\n\n' + TOOL_NO[noFue] : '');
      var msg = document.getElementById('copy-msg');
      function fallback() {
        msg.textContent = 'No se ha podido copiar solo. Selecciona el texto y cópialo:';
        var ta = document.createElement('textarea'); ta.className = 'copy-fallback'; ta.id = 'copy-text'; ta.value = txt; msg.after(ta); ta.select();
      }
      try { navigator.clipboard.writeText(txt).then(function () { msg.textContent = 'Copiado. Pégalo en una nota o envíaselo a quien también acompaña a tu peque.'; msg.scrollIntoView({ block: 'nearest' }); }, fallback); } catch (e) { fallback(); }
    };
  }
}

/* ================= ARRANQUE ================= */
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (document.querySelector('.sheet')) closeSheet(); else if (F) closeFlow(); } });
render();
</script>

</body></html>
