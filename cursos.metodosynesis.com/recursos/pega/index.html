<title>Kit Pega y muerde</title>

<style>
/* Layout: app móvil. Inicio con camino guiado; cada tarea se abre a pantalla completa con una sola cosa por pantalla; la caja es el objeto central; navegación inferior fija. */
:root {
  --bg: #F3EDE4;
  --surface: #FFFDF9;
  --soft: #E4EFE8;
  --text: #3A3A3A;
  --muted: #74746C;
  --sage: #8FAF9A;
  --sage-deep: #6D9278;
  --on-sage: #22302A;
  --terra: #D08770;
  --terra-soft: #F7E6DF;
  --line: rgba(58, 58, 58, 0.10);
  --shadow: 0 1px 2px rgba(58, 58, 58, 0.05), 0 10px 30px rgba(58, 58, 58, 0.07);
  --font: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --nav-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C211F; --surface: #252B28; --soft: #2C3832; --text: #EDE9E1; --muted: #AEB3AA;
    --sage: #8FAF9A; --sage-deep: #A9C6B2; --on-sage: #17201B; --terra: #E3A08A; --terra-soft: #3B2D27;
    --line: rgba(237, 233, 225, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C211F; --surface: #252B28; --soft: #2C3832; --text: #EDE9E1; --muted: #AEB3AA;
  --sage: #8FAF9A; --sage-deep: #A9C6B2; --on-sage: #17201B; --terra: #E3A08A; --terra-soft: #3B2D27;
  --line: rgba(237, 233, 225, 0.12);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sage-deep); outline-offset: 2px; }
svg.lucide { width: 22px; height: 22px; flex: none; }
[hidden] { display: none !important; }

.app { max-width: 520px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }

/* Cabecera */
.top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; }
.brand svg { width: 28px; height: 28px; color: var(--sage); }
.pill { font-size: 12px; font-weight: 600; color: var(--sage-deep); background: var(--soft); padding: 5px 11px; border-radius: 999px; }
.screen-title { font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; margin: 22px 0 6px; text-wrap: balance; }
.screen-sub { color: var(--muted); margin: 0 0 18px; }

/* Tarjetas */
.card { background: var(--surface); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); }
.stack { display: grid; gap: 14px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px/1.2 var(--font); background: var(--text); color: var(--bg); border: 0; border-radius: 999px; padding: 15px 22px; cursor: pointer; min-height: 52px; }
.btn.sage { background: var(--sage); color: var(--on-sage); }
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .35; cursor: default; }
.link { background: none; border: 0; padding: 0; font: 600 14px/1.4 var(--font); color: var(--sage-deep); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Hero de inicio */
.hero { background: var(--sage); color: var(--on-sage); border-radius: 28px; padding: 24px 22px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.14); }
.hero .k { font-size: 13px; font-weight: 600; opacity: .85; margin: 0 0 8px; }
.hero h2 { font-size: 24px; line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 18px; font-weight: 700; text-wrap: balance; position: relative; }
.hero blockquote { margin: 0 0 18px; font-size: 22px; line-height: 1.3; font-weight: 600; font-style: italic; text-wrap: balance; position: relative; }
.hero .btn { background: var(--on-sage); color: #F3EDE4; position: relative; }
.hero .meta { display: flex; align-items: center; gap: 14px; position: relative; }
.hero .meta span { font-size: 14px; font-weight: 500; opacity: .85; }

/* Camino */
.path { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: 20px; padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow); }
.step .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--soft); color: var(--sage-deep); }
.step.done .ic { background: var(--sage); color: var(--on-sage); }
.step.next { box-shadow: var(--shadow), inset 0 0 0 2px var(--sage); }
.step b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
.step small { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.step .go { color: var(--muted); }
.badge-next { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--on-sage); background: var(--sage); padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }

/* Mini caja en inicio */
.mini-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; border: 0; text-align: left; cursor: pointer; }
.mini-icons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mini-icons span { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.mini-icons span.in { background: var(--soft); color: var(--sage-deep); }
.mini-icons span.star { background: var(--sage); color: var(--on-sage); }
.mini-icons svg.lucide { width: 16px; height: 16px; }
.big-num { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.big-num small { font-size: 15px; font-weight: 500; color: var(--muted); letter-spacing: 0; }

/* Caja */
.box { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
.box-head { background: var(--sage-deep); color: #FFFDF9; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
.box-head b { font-size: 15px; }
.box-head span { font-size: 14px; font-variant-numeric: tabular-nums; opacity: .92; }
.meter { height: 6px; background: rgba(255,255,255,.25); border-radius: 6px; margin: 0 20px; position: relative; top: -10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: #FFFDF9; border-radius: 6px; transition: width .5s ease; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 8px 14px 16px; }
.tile { position: relative; border: 0; border-radius: 18px; padding: 14px 6px 12px; background: var(--bg); cursor: pointer; display: grid; justify-items: center; gap: 8px; min-height: 96px; align-content: center; }
.tile .ti { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: var(--muted); background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.tile span { font-size: 12.5px; font-weight: 600; line-height: 1.2; text-align: center; color: var(--muted); }
.tile.in { background: var(--soft); }
.tile.in .ti { background: var(--surface); color: var(--sage-deep); box-shadow: none; }
.tile.in span { color: var(--text); }
.tile.star { background: var(--sage); }
.tile.star .ti { background: rgba(255,255,255,.35); color: var(--on-sage); box-shadow: none; }
.tile.star span { color: var(--on-sage); }
.tile .st { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--terra); color: #fff; display: grid; place-items: center; }
.tile .st svg.lucide { width: 12px; height: 12px; }
.tile .rec { position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--terra); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); padding: 0 6px; margin-top: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

/* Lista de escenas */
.scene-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); cursor: pointer; }
.scene-card .where { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--terra); }
.scene-card b { display: block; font-size: 17px; margin: 2px 0 4px; }
.scene-card q { display: block; font-size: 14.5px; font-style: italic; color: var(--muted); quotes: "«" "»"; line-height: 1.4; }
.scene-card .ok { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.scene-card .ok.done { background: var(--sage); color: var(--on-sage); }

/* Navegación inferior */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.nav button { background: none; border: 0; cursor: pointer; display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--text); }
.nav button[aria-current="page"] .nic { background: var(--soft); color: var(--sage-deep); }
.nav .nic { width: 54px; height: 30px; border-radius: 999px; display: grid; place-items: center; }

/* Flujo a pantalla completa */
.flow { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); animation: up .28s ease; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.flow-bar { flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); max-width: 560px; width: 100%; margin: 0 auto; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); }
.bar { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sage); border-radius: 6px; transition: width .35s ease; }
.flow-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.flow-in { max-width: 520px; margin: 0 auto; padding: 12px max(22px, env(safe-area-inset-right, 0px)) 24px max(22px, env(safe-area-inset-left, 0px)); }
.flow-foot { flex: none; padding: 12px max(22px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); max-width: 520px; width: 100%; margin: 0 auto; display: grid; gap: 10px; }
.flow-foot:empty { display: none; }
.q-kicker { font-size: 13px; font-weight: 600; color: var(--sage-deep); margin: 8px 0 8px; }
.q { font-size: 27px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; text-wrap: balance; }
.q-help { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: 500 16px/1.4 var(--font); background: var(--surface); border: 0; border-radius: 18px; padding: 16px 18px; cursor: pointer; box-shadow: var(--shadow); min-height: 60px; transition: transform .1s; }
.opt:active { transform: scale(.985); }
.opt .oi { width: 36px; height: 36px; border-radius: 12px; background: var(--soft); color: var(--sage-deep); display: grid; place-items: center; flex: none; }
.opt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--sage-deep), var(--shadow); background: var(--soft); }
.opt[aria-pressed="true"] .oi { background: var(--sage); color: var(--on-sage); }
.opt.picked { box-shadow: inset 0 0 0 2px var(--sage-deep); background: var(--soft); }
.opt.faded { opacity: .45; }
.opt:disabled { cursor: default; }
.group-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 22px 0 -6px; }
.tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.tool-grid .tile { background: var(--surface); box-shadow: var(--shadow); }
.tool-grid .tile[aria-pressed="true"] { background: var(--sage); }
.tool-grid .tile[aria-pressed="true"] .ti { background: rgba(255,255,255,.35); color: var(--on-sage); box-shadow: none; }
.tool-grid .tile[aria-pressed="true"] span { color: var(--on-sage); }

/* Páginas de resultado */
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 7px; background: var(--line); transition: width .25s; }
.dots i.on { width: 22px; background: var(--sage-deep); }
.big-card { background: var(--surface); border-radius: 28px; padding: 26px 22px; box-shadow: var(--shadow); margin-top: 8px; }
.big-card.sage { background: var(--sage); color: var(--on-sage); }
.big-card.terra { background: var(--terra-soft); }
.big-card .k { font-size: 13px; font-weight: 600; margin: 0 0 10px; opacity: .85; }
.quote { font-size: 27px; line-height: 1.25; font-weight: 600; font-style: italic; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.4); margin-top: 18px; }
.big-card h3 { font-size: 22px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.01em; }
.big-card p { margin: 0 0 12px; font-size: 17px; }
.big-card p:last-child { margin-bottom: 0; }
.center-page { min-height: calc(100vh - 230px); display: grid; align-content: center; }
.center-page .big-card.sage { padding: 34px 26px; }
.center-page .big-card.sage .quote { font-size: 31px; }
.soft-note { font-size: 15px; color: var(--muted); background: var(--bg); border-radius: 16px; padding: 12px 14px; margin-top: 16px; }
.sign { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; }
.sign:first-of-type { border-top: 0; }
.sign .si { width: 36px; height: 36px; border-radius: 12px; background: var(--soft); color: var(--sage-deep); display: grid; place-items: center; }
.num { width: 30px; height: 30px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 14px; font-weight: 700; }

/* Escenas */
.voice-card { background: var(--terra-soft); border-radius: 28px; padding: 28px 24px; margin-top: 8px; }
.voice-card .who { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--terra); margin-bottom: 14px; }
.voice-card .quote { font-size: 28px; }
.scene-text { font-size: 19px; line-height: 1.5; margin: 6px 0 0; }
.fb { border-radius: 22px; padding: 18px; margin-top: 16px; animation: up .25s ease; }
.fb.good { background: var(--sage); color: var(--on-sage); }
.fb.other { background: var(--terra-soft); }
.fb b { display: flex; align-items: center; gap: 8px; font-size: 17px; margin-bottom: 4px; }
.fb p { margin: 0; font-size: 16px; }
.fb .better { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(58,58,58,.12); }
.fb .better small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--terra); margin-bottom: 4px; }
.recap { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.recap:first-of-type { border-top: 0; }
.recap p { margin: 0; font-size: 15.5px; }
.recap small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }

/* Hoja inferior */
.sheet-bg { position: fixed; inset: 0; z-index: 60; background: rgba(28, 33, 31, .38); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px max(22px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); animation: sheetUp .3s cubic-bezier(.2,.9,.3,1); }
@keyframes sheetUp { from { transform: translateY(100%); } }
.sheet-in { max-width: 520px; margin: 0 auto; }
.grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 16px; }
.sheet-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.sheet-head .ti { width: 56px; height: 56px; border-radius: 18px; background: var(--soft); color: var(--sage-deep); display: grid; place-items: center; }
.sheet-head .ti svg.lucide { width: 28px; height: 28px; }
.sheet-head h3 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; }
.sheet-head small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.block-k { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--sage-deep); margin: 0 0 6px; }
.game { background: var(--bg); border-radius: 18px; padding: 16px; font-size: 16px; margin-bottom: 14px; }
.say { background: var(--soft); border-radius: 18px; padding: 16px; font-size: 19px; font-weight: 600; font-style: italic; line-height: 1.35; margin-bottom: 18px; }
.status-row { display: flex; gap: 8px; margin-bottom: 16px; }
.status-row span { flex: 1; text-align: center; font-size: 12.5px; font-weight: 600; padding: 8px 4px; border-radius: 12px; background: var(--bg); color: var(--muted); }
.status-row span.on { background: var(--sage); color: var(--on-sage); }
.party { text-align: center; padding: 6px 0 4px; }
.party .burst { width: 84px; height: 84px; border-radius: 50%; background: var(--sage); color: var(--on-sage); display: grid; place-items: center; margin: 4px auto 14px; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
.party .burst svg.lucide { width: 40px; height: 40px; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.party h3 { font-size: 24px; margin: 0 0 8px; }
.party p { color: var(--muted); margin: 0 0 18px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

    '<div class="box"><div class="box-head"><b>' + n + ' de ' + TOOLS.length + '</b><span>' + icon('star') + ' ' + stars() + '</span></div>' +
    '<div class="meter"><i style="width:' + Math.round(n / TOOLS.length * 100) + '%"></i></div>' +
    '<div class="tiles">' + TOOLS.map(function (t) {
      var l = lvl(t.id);
      return '<button class="tile' + (l === 2 ? ' star' : l ? ' in' : '') + '" data-tool="' + t.id + '">' +
        (l === 2 ? '<span class="st">' + icon('star') + '</span>' : (!l && rec.indexOf(t.id) > -1 ? '<span class="rec" aria-label="Recomendada"></span>' : '')) +
        '<span class="ti">' + icon(t.icon) + '</span><span>' + t.nombre + '</span></button>';
    }).join('') + '</div></div>' +
    '<div class="legend"><span><i style="background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--sage)"></i>Practicada</span><span><i style="background:var(--sage)"></i>La usa por su cuenta</span>' + (rec.length ? '<span><i style="background:var(--terra)"></i>Recomendada</span>' : '') + '</div>' +
    (mem.det ? '' : '<div class="card" style="margin-top:18px;display:flex;gap:14px;align-items:center"><span style="flex:1"><b>¿No sabes por cuál empezar?</b><br><span style="color:var(--muted);font-size:14.5px">Descubre qué le dice su golpe y te las marcamos.</span></span><button class="btn sage" data-act="detector">Descubrir</button></div>');
  app.querySelectorAll('[data-tool]').forEach(function (b) { b.onclick = function () { openTool(b.getAttribute('data-tool')); }; });
  var d = app.querySelector('[data-act="detector"]'); if (d) d.onclick = openDetector;
}

/* ================= HOJA DE HERRAMIENTA ================= */
function closeSheet() { document.getElementById('sheet-root').innerHTML = ''; if (!document.querySelector('.flow')) document.body.classList.remove('locked'); }
function sheet(html) {
  document.body.classList.add('locked');
  document.getElementById('sheet-root').innerHTML = '<div class="sheet-bg" id="sheet-bg"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div>' + html + '</div></div>';
  document.getElementById('sheet-bg').onclick = closeSheet;
  drawIcons();
}
function openTool(id, party) {
  var t = tool(id), l = lvl(id);
  if (party) {
    sheet('<div class="party"><div class="burst">' + icon('star') + '</div><h3>¡Lo ha usado por su cuenta!</h3><p>Díselo con una sonrisa: «¡Lo has conseguido! Has usado tu herramienta». Eso es justo lo que estáis construyendo.</p><button class="btn block" id="sh-ok">Seguir</button></div>');
    document.getElementById('sh-ok').onclick = function () { closeSheet(); render(); };
    return;
  }
  var cta = l === 0 ? '<button class="btn block" id="sh-a">' + icon('check') + ' La hemos practicado jugando</button>'
    : l === 1 ? '<button class="btn sage block" id="sh-a">' + icon('star') + ' ¡La ha usado por su cuenta!</button>' : '';
  sheet('<div class="sheet-head"><span class="ti">' + icon(t.icon) + '</span><span><small>' + MOTIVO_TXT[t.motivo] + '</small><h3>' + t.nombre + '</h3></span></div>' +
    '<div class="status-row"><span class="' + (l >= 1 ? 'on' : '') + '">1 · Practicada</span><span class="' + (l === 2 ? 'on' : '') + '">2 · La usa sola</span></div>' +
    '<p class="block-k">Juego de 5 minutos</p><div class="game">' + t.juego + '</div>' +
    '<p class="block-k">En el momento, díselo así</p><div class="say">«' + t.frase + '»</div>' +
    '<div style="display:grid;gap:10px">' + cta + (l ? '<button class="link" id="sh-r" style="justify-self:center">Quitar de la caja</button>' : '') + '</div>');
  var a = document.getElementById('sh-a');
  if (a) a.onclick = function () { mem.caja[id] = l + 1; save(); if (l + 1 === 2) openTool(id, true); else { closeSheet(); render(); } };
  var r = document.getElementById('sh-r');
  if (r) r.onclick = function () { mem.caja[id] = 0; save(); closeSheet(); render(); };
}

/* ================= ESCENAS ================= */
function renderEscenas() {
  var app = document.getElementById('app');
  app.innerHTML = header() +
    '<h1 class="screen-title">Ponte en sus zapatos</h1><p class="screen-sub">Cada escena empieza por lo que siente tu peque. Luego decides qué harías. Sin notas.</p>' +
    '<div class="stack">' + SIM.map(function (s) {
      var d = mem.sims.indexOf(s.n) > -1;
      return '<button class="scene-card" data-n="' + s.n + '"><span><span class="where">' + s.donde + '</span><b>' + s.titulo + '</b><q>' + s.voz + '</q></span><span class="ok' + (d ? ' done' : '') + '">' + icon(d ? 'check' : 'play') + '</span></button>';
    }).join('') + '</div>' +
    '<p style="text-align:center;color:var(--muted);font-size:13px;margin-top:18px">Prototipo con 6 escenas de muestra. La versión final tendrá unas 16.</p>';
  app.querySelectorAll('[data-n]').forEach(function (b) { b.onclick = function () { openSim(Number(b.getAttribute('data-n'))); }; });
}

/* ================= MOTOR DE FLUJOS ================= */
var F = null;
function flow(o) {
  F = o; document.body.classList.add('locked');
  var root = document.getElementById('flow-root');
  root.innerHTML = '<div class="flow" role="dialog" aria-modal="true"><div class="flow-bar"><button class="icon-btn" id="f-back" aria-label="Atrás">' + icon('arrow-left') + '</button><div class="bar"><i id="f-bar"></i></div><button class="icon-btn" id="f-close" aria-label="Cerrar">' + icon('x') + '</button></div><div class="flow-body" id="f-body"><div class="flow-in" id="f-in"></div></div><div class="flow-foot" id="f-foot"></div></div>';
  document.getElementById('f-close').onclick = closeFlow;
  document.getElementById('f-back').onclick = function () { if (F.back) F.back(); };
  F.draw();
}
function closeFlow() { document.getElementById('flow-root').innerHTML = ''; F = null; document.body.classList.remove('locked'); render(); }
function paint(p, inner, foot, canBack) {
  document.getElementById('f-bar').style.width = Math.round(p * 100) + '%';
  document.getElementById('f-in').innerHTML = inner;
  document.getElementById('f-foot').innerHTML = foot || '';
  document.getElementById('f-back').style.visibility = canBack ? 'visible' : 'hidden';
  document.getElementById('f-body').scrollTop = 0;
  drawIcons();
}
function optsHtml(opts, pressed, multi) {
  return '<div class="opts">' + opts.map(function (o) {
    var on = multi ? pressed.indexOf(o.id) > -1 : pressed === o.id;
    return '<button class="opt" data-id="' + o.id + '" aria-pressed="' + on + '">' + (o.i ? '<span class="oi">' + icon(o.i) + '</span>' : '') + '<span>' + o.t + '</span></button>';
  }).join('') + '</div>';
}

/* ---------- Detector ---------- */
function openDetector() {
  var st = { i: 0, a: {}, page: 0, res: null };
  function score() {
    var sc = { rabia: 0, impulso: 0, nosabe: 0, conexion: 0, imitacion: 0, cansancio: 0 };
    D_STEPS.forEach(function (S) { var o = S.opts.filter(function (x) { return x.id === st.a[S.key]; })[0]; if (o && o.s) Object.keys(o.s).forEach(function (k) { sc[k] += o.s[k]; }); });
    return Object.keys(sc).sort(function (a, b) { return sc[b] - sc[a]; })[0];
  }
  flow({
    back: function () { if (st.res) { if (st.page > 0) st.page--; else { st.res = null; st.i = D_STEPS.length - 1; } } else if (st.i > 0) st.i--; F.draw(); },
    draw: function () {
      if (!st.res) {
        var S = D_STEPS[st.i];
        paint((st.i + 1) / (D_STEPS.length + 5), '<p class="q-kicker">Pregunta ' + (st.i + 1) + ' de ' + D_STEPS.length + '</p><h2 class="q">' + S.q + '</h2>' + optsHtml(S.opts, st.a[S.key]), '', st.i > 0);
        document.querySelectorAll('#f-in .opt').forEach(function (b) {
          b.onclick = function () {
            st.a[S.key] = b.getAttribute('data-id'); b.setAttribute('aria-pressed', 'true');
            setTimeout(function () {
              if (st.i < D_STEPS.length - 1) st.i++;
              else { st.res = { motivo: score(), accion: st.a.accion }; st.page = 0; mem.det = st.res; save(); }
              F.draw();
            }, 160);
          };
        });
        return;
      }
      var M = MOTIVOS[st.res.motivo], acc = st.res.accion, verbo = acc === 'muerde' ? 'morder' : 'pegar', rec = recTools();
      var pages = [
        '<div class="big-card sage"><p class="k">Cuando ' + (acc === 'muerde' ? 'muerde' : 'pega') + ' así, en realidad te está diciendo</p><p class="quote">«' + M[acc] + '»</p><span class="chip">' + icon(M.icon) + M.nombre + '</span></div>',
        '<div class="big-card"><h3>Qué le pasa por dentro</h3><p>' + M.dentro + '</p><div class="soft-note">' + (acc === 'muerde' ? 'Morder' : 'Pegar') + ' a esta edad es frecuente. No significa que sea agresivo: su caja de herramientas todavía tiene pocas.</div></div>',
        '<div class="big-card"><h3>Cómo verlo venir</h3>' + M.senales.map(function (s) { return '<div class="sign"><span class="si">' + icon(s[0]) + '</span><span>' + s[1] + '</span></div>'; }).join('') + '</div>',
        '<div class="big-card"><h3>Qué hacer en el momento</h3>' + M.hacer.map(function (h, i) { return '<div class="sign"><span class="num">' + (i + 1) + '</span><span>' + h.replace('{verbo}', verbo) + '</span></div>'; }).join('') + '</div>',
        '<div class="big-card terra"><h3>Lo que necesita su caja</h3><p style="font-size:15.5px;color:var(--muted)">Empieza por estas. Cada una tiene un juego de 5 minutos.</p><div class="tool-grid">' + rec.map(function (id) { var t = tool(id); return '<div class="tile in"><span class="ti">' + icon(t.icon) + '</span><span>' + t.nombre + '</span></div>'; }).join('') + '</div></div>' +
          '<p style="text-align:center;margin-top:18px"><button class="link" id="pro">¿Cuándo conviene consultarlo?</button></p>'
      ];
      var last = st.page === pages.length - 1;
      var dots = '<div class="dots">' + pages.map(function (_, i) { return '<i class="' + (i === st.page ? 'on' : '') + '"></i>'; }).join('') + '</div>';
      paint((D_STEPS.length + st.page + 1) / (D_STEPS.length + 5), '<div class="center-page">' + pages[st.page] + '</div>', dots + (last ? '<button class="btn block" id="f-next">Ver los juegos en su caja ' + icon('arrow-right') + '</button>' : '<button class="btn block" id="f-next">Siguiente</button>'), true);
      document.getElementById('f-next').onclick = function () { if (last) { closeFlow(); go('caja'); } else { st.page++; F.draw(); } };
      var p = document.getElementById('pro');
      if (p) p.onclick = function () { sheet('<h3 style="font-size:22px;margin:0 0 10px">Cuándo conviene consultarlo</h3><p>Coméntalo con su pediatra si los golpes o mordiscos son muy frecuentes y van a más con el tiempo, si hace daño intenso a menudo, o si te preocupan otras cosas de su desarrollo.</p><p style="color:var(--muted)">Pedir otra mirada también es acompañar.</p><button class="btn block" id="sh-ok">Entendido</button>'); document.getElementById('sh-ok').onclick = closeSheet; };
    }
  });
}

/* ---------- Escena ---------- */
function openSim(n) {
  var s = SIM.filter(function (x) { return x.n === n; })[0];
  var st = { p: 0, pick: null, order: shuffle([0, 1, 2]) };
  var TOTAL = 6;
  flow({
    back: function () { if (st.p > 0) { st.p--; st.pick = null; st.order = shuffle([0, 1, 2]); F.draw(); } },
    draw: function () {
      if (st.p === 0) {
        paint(1 / TOTAL, '<p class="q-kicker">' + s.donde + '</p><div class="voice-card"><div class="who">' + icon('heart') + ' Lo que siente tu peque</div><p class="quote">«' + s.voz + '»</p></div>', '<button class="btn block" id="f-next">Ver qué pasó</button>', false);
      } else if (st.p === 1) {
        paint(2 / TOTAL, '<p class="q-kicker">La escena</p><h2 class="q">' + s.titulo + '</h2><p class="scene-text">' + s.escena + '</p>', '<button class="btn block" id="f-next">¿Qué harías tú?</button>', true);
      } else if (st.p < 5) {
        var k = st.p - 2, opts = s.d[k];
        var html = '<p class="q-kicker">Decisión ' + (k + 1) + ' de 3</p><h2 class="q">' + DECISIONES[k] + '</h2><div class="opts">' + st.order.map(function (j) {
          var cls = 'opt' + (st.pick !== null ? (j === st.pick ? ' picked' : ' faded') : '');
          return '<button class="' + cls + '" data-j="' + j + '"' + (st.pick !== null ? ' disabled' : '') + '><span>' + opts[j][0] + '</span></button>';
        }).join('') + '</div>';
        if (st.pick !== null) {
          html += st.pick === 0
            ? '<div class="fb good"><b>' + icon('check-circle') + ' Esto es lo que ayuda</b><p>' + opts[0][1] + '</p></div>'
            : '<div class="fb other"><b>' + icon(st.pick === 1 ? 'arrow-up-right' : 'info') + (st.pick === 1 ? ' Vas por buen camino' : ' Pasa mucho') + '</b><p>' + opts[st.pick][1] + '</p><div class="better"><small>Lo que más ayuda</small><p><b style="display:inline;font-size:16px">' + opts[0][0] + '</b> ' + opts[0][1] + '</p></div></div>';
        }
        paint((st.p + 1) / TOTAL, html, st.pick !== null ? '<button class="btn block" id="f-next">' + (k < 2 ? 'Continuar' : 'Terminar') + '</button>' : '', true);
        document.querySelectorAll('#f-in .opt').forEach(function (b) {
          b.onclick = function () { st.pick = Number(b.getAttribute('data-j')); F.draw(); var fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
        });
      } else {
        var T = tool(s.tool);
        if (mem.sims.indexOf(s.n) === -1) { mem.sims.push(s.n); save(); }
        paint(1, '<div style="text-align:center;margin:10px 0 18px"><div class="party"><div class="burst">' + icon('check') + '</div></div><h2 class="q">Escena practicada</h2><p class="q-help">Esto es lo que te llevas:</p></div>' +
          '<div class="big-card">' + s.d.map(function (dd, i) { return '<div class="recap"><span class="num">' + (i + 1) + '</span><p><small>' + DECISIONES[i] + '</small>' + dd[0][0] + '</p></div>'; }).join('') + '</div>' +
          '<div class="big-card terra" style="display:flex;align-items:center;gap:14px"><span class="tile in" style="min-height:0;padding:10px;flex:none"><span class="ti">' + icon(T.icon) + '</span></span><span><small style="color:var(--muted);font-weight:600;font-size:13px">Herramienta de esta escena</small><br><b style="font-size:17px">' + T.nombre + '</b></span></div>',
          '<button class="btn block" id="f-tool">Ver su juego</button><button class="btn ghost block" id="f-done">Volver a las escenas</button>', false);
        document.getElementById('f-tool').onclick = function () { closeFlow(); go('caja'); openTool(s.tool); };
        document.getElementById('f-done').onclick = function () { closeFlow(); go('escenas'); };
        return;
      }
      var nx = document.getElementById('f-next');
      if (nx) nx.onclick = function () { st.p++; st.pick = null; st.order = shuffle([0, 1, 2]); F.draw(); };
    }
  });
}

/* ---------- Mi semana ---------- */
function openSemana() {
  var st = { i: 0, a: { veces: null, motivo: null, uso: [], hice: [] }, done: false };
  var STEPS = ['veces', 'motivo', 'uso', 'hice'];
  function active() { return st.a.veces === '0' ? ['veces', 'uso'] : STEPS; }
  flow({
    back: function () { if (st.done) st.done = false; else if (st.i > 0) st.i--; F.draw(); },
    draw: function () {
      var steps = active();
      if (!st.done) {
        var key = steps[st.i], html, foot = '', multi = false;
        var prog = (st.i + 1) / (steps.length + 1);
        if (key === 'veces') html = '<p class="q-kicker">Mi semana</p><h2 class="q">¿Cuántas veces pegó o mordió esta semana?</h2>' + optsHtml([{ id: '0', t: 'Ninguna', i: 'sun' }, { id: '1', t: '1 o 2 veces', i: 'cloud' }, { id: '3', t: 'De 3 a 5 veces', i: 'cloud-rain' }, { id: '6', t: 'Más de 5 veces', i: 'cloud-lightning' }], st.a.veces);
        if (key === 'motivo') html = '<p class="q-kicker">Mi semana</p><h2 class="q">¿Qué parecía haber detrás?</h2><p class="q-help">La mayoría de las veces.</p>' + optsHtml(Object.keys(MOTIVOS).map(function (k) { return { id: k, t: MOTIVOS[k].nombre, i: MOTIVOS[k].icon }; }).concat([{ id: 'nose', t: 'No lo sé', i: 'help-circle' }]), st.a.motivo);
        if (key === 'uso') { multi = true; html = '<p class="q-kicker">Mi semana</p><h2 class="q">¿Usó alguna herramienta por su cuenta?</h2><p class="q-help">Aunque solo fuera una vez. Toca todas las que usó.</p><div class="tool-grid">' + TOOLS.map(function (t) { return '<button class="tile" data-id="' + t.id + '" aria-pressed="' + (st.a.uso.indexOf(t.id) > -1) + '"><span class="ti">' + icon(t.icon) + '</span><span>' + t.nombre + '</span></button>'; }).join('') + '</div>'; foot = '<button class="btn block" id="f-next">' + (st.a.uso.length ? 'Siguiente' : 'Todavía ninguna') + '</button>'; }
        if (key === 'hice') { multi = true; html = '<p class="q-kicker">Mi semana</p><h2 class="q">¿Y tú, qué hiciste?</h2><p class="q-help">Sin notas: lo que no sale bien también cuenta.</p><p class="group-label">Lo que enseña el mini-curso</p>' + optsHtml(HICE_BIEN, st.a.hice, true) + '<p class="group-label">Lo que también pasa</p>' + optsHtml(Object.keys(NO_FUE).map(function (k) { return { id: k, t: NO_FUE[k].t, i: NO_FUE[k].i }; }), st.a.hice, true); foot = '<button class="btn block" id="f-next">Ver mi semana</button>'; }
        if (key === 'uso' && steps.length === 2) foot = '<button class="btn block" id="f-next">Ver mi semana</button>';
        paint(prog, html, foot, st.i > 0);
        document.querySelectorAll('#f-in [data-id]').forEach(function (b) {
          b.onclick = function () {
            var id = b.getAttribute('data-id');
            if (multi) { var arr = st.a[key], i = arr.indexOf(id); if (i > -1) arr.splice(i, 1); else arr.push(id); F.draw(); return; }
            st.a[key] = id; b.setAttribute('aria-pressed', 'true');
            setTimeout(function () { st.i++; F.draw(); }, 160);
          };
        });
        var nx = document.getElementById('f-next');
        if (nx) nx.onclick = function () { if (st.i < steps.length - 1) st.i++; else { st.done = true; finish(); } F.draw(); };
        return;
      }
      drawResult();
    }
  });
  function finish() {
    st.a.uso.forEach(function (id) { mem.caja[id] = 2; });
    var d = new Date(); mem.semana = d.getDate() + '/' + (d.getMonth() + 1); save();
  }
  function drawResult() {
    var a = st.a, M = a.motivo && a.motivo !== 'nose' ? MOTIVOS[a.motivo] : null;
    var html = '';
    if (a.uso.length) html += '<div class="big-card sage"><p class="k">' + icon('star') + ' Esta semana ha usado por su cuenta</p><div class="tool-grid" style="margin-top:6px">' + a.uso.map(function (id) { var t = tool(id); return '<div class="tile star"><span class="ti">' + icon(t.icon) + '</span><span>' + t.nombre + '</span></div>'; }).join('') + '</div><p style="margin-top:14px;font-size:16px">Cada vez que elige una herramienta en lugar del golpe, aprende otra forma de decir lo que siente.</p></div>';
    var animo = a.veces === '0' ? 'Una semana sin golpes ni mordiscos. Disfrútala. Si vuelve a pasar, no es un paso atrás.'
      : a.veces === '1' ? 'Una o dos veces en una semana es más común de lo que parece a esta edad. Lo que más cuenta es lo que pasa después.'
      : 'Ha sido una semana intensa. No dice nada malo de tu peque ni de ti: su caja todavía tiene pocas herramientas. Empieza por una.';
    html += '<h2 class="q" style="margin-top:' + (a.uso.length ? '24px' : '8px') + '">' + (a.veces === '0' ? 'Semana tranquila' : 'Tu semana') + '</h2><p class="q-help" style="font-size:17px;color:var(--text)">' + animo + '</p>';
    if (M) html += '<div class="big-card" style="margin-top:16px"><p class="k" style="color:var(--sage-deep)">Su golpe parece decir</p><p class="quote" style="font-size:22px">«' + M.pega + '»</p></div>';
    var pool = M ? M.tools : ['pisar', 'esmio', 'brazo'];
    var next = pool.filter(function (id) { return lvl(id) === 0; })[0] || pool.filter(function (id) { return lvl(id) < 2; })[0] || pool[0];
    var T = tool(next);
    html += '<div class="big-card terra" style="margin-top:14px"><p class="k" style="color:var(--terra)">Para la semana que viene</p><div style="display:flex;gap:14px;align-items:center"><span class="tile in" style="min-height:0;padding:10px;flex:none"><span class="ti">' + icon(T.icon) + '</span></span><span><b style="font-size:18px">' + T.nombre + '</b><br><span style="color:var(--muted);font-size:14.5px">Un juego de 5 minutos para practicarla.</span></span></div><button class="btn block" style="margin-top:16px" id="r-tool">Ver el juego</button></div>';
    var no = ['cachete', 'grite', 'perdon', 'castigue'].filter(function (k) { return a.hice.indexOf(k) > -1; })[0];
    if (no) html += '<div class="big-card" style="margin-top:14px"><p class="k" style="color:var(--muted)">Para lo que no salió como querías</p><p style="font-size:16px">' + NO_FUE[no].txt + '</p></div>';
    var sc = M ? SIM.filter(function (x) { return x.motivo === a.motivo; })[0] : null;
    if (sc) html += '<button class="scene-card" id="r-sim" style="margin-top:14px"><span><span class="where">Practica esta escena</span><b>' + sc.titulo + '</b><q>' + sc.voz + '</q></span><span class="ok">' + icon('play') + '</span></button>';
    paint(1, html, '<button class="btn block" id="r-done">Hecho</button>', true);
    document.getElementById('r-done').onclick = closeFlow;
    document.getElementById('r-tool').onclick = function () { closeFlow(); go('caja'); openTool(next); };
    var rs = document.getElementById('r-sim'); if (rs) rs.onclick = function () { closeFlow(); openSim(sc.n); };
  }
}

/* ================= ARRANQUE ================= */
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (document.querySelector('.sheet')) closeSheet(); else if (F) closeFlow(); } });
render();
</script>

</body></html>
